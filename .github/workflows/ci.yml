name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel a superseded run when new commits land on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Build every package once and warm the turbo cache. The cache restores from
  # the newest entry on this or the default branch, so only packages whose
  # inputs changed since that run are rebuilt. The downstream jobs restore this
  # run's entry by exact key and get every .dist back from cache without
  # rebuilding; .dist output is Node-independent, so one entry serves the
  # whole matrix. Nothing downstream writes back, so test and typecheck results
  # are never cached and always run fresh.
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - run: pnpm build

  # Lint and format read source only (no type-aware rules, no cross-package
  # resolution), so they run immediately without waiting on the build.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm lint

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm inspect

  # Downstream packages resolve @open-apiary/* to sibling .dist type declarations,
  # so typecheck needs the build output. The cached pnpm build restores it
  # without rebuilding; nuxt prepare generates the module types it also reads.
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Restore turbo cache
        uses: actions/cache/restore@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          fail-on-cache-miss: true
      - run: pnpm build
      - run: pnpm -r prepare
      - run: pnpm typecheck

  # Only the tests exercise runtime behaviour, so they alone fan out across the
  # supported Node versions. The rest of the gate is Node-independent.
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "25"]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      - name: Restore turbo cache
        uses: actions/cache/restore@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          fail-on-cache-miss: true
      - run: pnpm build
      - run: pnpm -r prepare
      - run: pnpm test

  # A single aggregated coverage pass on the pinned Node version — the matrix
  # already proves the suite passes everywhere, so there is no value in
  # uploading identical coverage per version. Runs the federated root vitest
  # config, which emits .coverage/lcov.info for the Codecov upload.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Restore turbo cache
        uses: actions/cache/restore@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          fail-on-cache-miss: true
      - run: pnpm build
      - run: pnpm -r prepare
      - run: pnpm coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: .coverage/lcov.info
          fail_ci_if_error: false
